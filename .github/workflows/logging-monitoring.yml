name: Build Wren AI for Logging/Monitoring

on:
  push:
    branches:
      - feat/logging-monitoring
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: wren-ui
            image: wren-ui
            context: ./wren-ui
            dockerfile: ./wren-ui/Dockerfile

          - name: wren-ai-service
            image: wren-ai-service
            context: ./wren-ai-service
            dockerfile: ./wren-ai-service/docker/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Dockerfile exists
        run: |
          echo "Checking Dockerfile: ${{ matrix.service.dockerfile }}"
          test -f "${{ matrix.service.dockerfile }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_DEV_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DEV_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_DEV_USERNAME }}/${{ matrix.service.image }}:logging-monitoring
            ${{ secrets.DOCKERHUB_DEV_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-logging
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-logging
